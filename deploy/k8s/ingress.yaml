# Traefik。上傳大小（預設無上限）、SSE（預設不緩衝、即時轉送）、長串流（預設無寫入逾時）都不必另外設定。
# 叢集層級要確認的事（Traefik 的 entrypoint 靜態設定，不在這份 YAML）見 docs/deploy.md「Traefik」。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lantern
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: cert-manager-prod   # cert-manager 依 spec.tls 建立 lantern-tls
spec:
  ingressClassName: traefik   # 確認：kubectl get ingressclass
  tls:
    - hosts: [lantern.toolmen.bime.ntu.edu.tw]
      secretName: lantern-tls
  rules:
    - host: lantern.toolmen.bime.ntu.edu.tw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: lantern, port: { name: http } }
