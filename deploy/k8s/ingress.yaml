# 以 ingress-nginx 為例；其他 Ingress controller 要換成對應的設定（見 docs/deploy.md）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lantern
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "160m"      # 上傳 PDF 上限 150 MB
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"   # SSE 串流（翻譯、問答、Wiki 更新）會開很久
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"       # SSE 不能被緩衝，否則字不會即時出現
    # cert-manager.io/cluster-issuer: TODO                   # 用 cert-manager 自動簽憑證時打開
spec:
  ingressClassName: nginx     # TODO: 叢集的 IngressClass
  tls:
    - hosts: [LANTERN_HOST]   # TODO: Lantern 公開網域
      secretName: lantern-tls
  rules:
    - host: LANTERN_HOST      # TODO
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: lantern, port: { name: http } }
