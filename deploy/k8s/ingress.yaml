# Traefik。上傳大小（預設無上限）、SSE（預設不緩衝、即時轉送）、長串流（預設無寫入逾時）都不必另外設定。
# 叢集層級要確認的事（Traefik 的 entrypoint 靜態設定，不在這份 YAML）見 docs/deploy.md「Traefik」。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lantern
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # 二選一簽憑證：
    # cert-manager.io/cluster-issuer: TODO                          # 用 cert-manager（spec.tls 的 secretName 會由它建立）
    # traefik.ingress.kubernetes.io/router.tls.certresolver: TODO   # 用 Traefik 內建 ACME（這時可以拿掉 spec.tls.secretName）
spec:
  ingressClassName: traefik   # TODO: 確認叢集的 IngressClass 名稱（kubectl get ingressclass）
  tls:
    - hosts: [LANTERN_HOST]   # TODO: Lantern 公開網域
      secretName: lantern-tls
  rules:
    - host: LANTERN_HOST      # TODO
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: lantern, port: { name: http } }
