# 非機密設定。機密（client secret、session secret、模型 API key）放 Secret lantern-secrets，見 docs/deploy.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: lantern-config
data:
  APP_VERSION: "0.3.0"          # 登入頁右下角；和映像 tag 一起改
  # 登入（docs/auth.md）
  AUTH_MODE: oidc
  OIDC_ISSUER: https://keycloak.toolmen.bime.ntu.edu.tw/realms/Toolmen_application
  OIDC_CLIENT_ID: lantern-local        # 沿用本機的 client；它的 redirect URI 要加上正式網域（docs/deploy.md）
  PUBLIC_BASE_URL: https://lantern.toolmen.bime.ntu.edu.tw
  SESSION_MAX_AGE: "28800"
  ADMIN_USERS: chenz8174@gmail.com    # 看得到「API 用量」的人（docs/usage.md）
  # 模型（與本機 .env 實際生效的值相同；本機 vLLM 的 LLM_BASE_URL 不搬）
  LLM_PROVIDER: anthropic
  LLM_MODEL: claude-opus-5-5
  LLM_CONTEXT_TOKENS: "1000000"
  LLM_EFFORT: medium
  LLM_CONCURRENCY: "4"
  DISABLE_THINKING: "true"
  LLM_MODEL_EXPLAIN: anthropic:claude-sonnet-5-5
  LLM_MODEL_TRANSLATE: anthropic:claude-sonnet-5-5
  LLM_MODEL_HIGHLIGHT: anthropic:claude-sonnet-5-5
  LLM_MODEL_CITE: anthropic:claude-sonnet-5-5
  LLM_MODEL_OUTLINE: anthropic:claude-haiku-5-5
  LLM_MODEL_SUGGEST: anthropic:claude-haiku-5-5
  # 省錢：聊天、Wiki、筆記、看圖用 Sonnet；摘要留 LLM_MODEL（Opus）
  LLM_MODEL_CHAT: anthropic:claude-sonnet-5-5
  LLM_MODEL_WIKI: anthropic:claude-sonnet-5-5
  LLM_MODEL_NOTE: anthropic:claude-sonnet-5-5
  VLM_MODEL: anthropic:claude-sonnet-5-5
  LLM_MODEL_QUERY: anthropic:claude-haiku-5-5   # 檢索前把中文問題改寫成英文
  OCR_ENABLED: "true"
  OCR_MODEL: anthropic:claude-sonnet-5-5
  # 逐句對應的 LaBSE（docs/labse.md）；金鑰 ALIGN_EMBED_API_KEY 放 Secret
  ALIGN_EMBED_URL: http://labse.aaron-personal.svc.cluster.local:8000/v1
  ALIGN_EMBED_MODEL: labse
  # 聊天／Wiki 檢索（docs/retrieval.md）；金鑰 EMBED_API_KEY 放 Secret（reranker 沿用同一把）
  EMBED_BASE_URL: http://bge-m3.aaron-personal.svc.cluster.local:8000/v1
  EMBED_MODEL: bge-m3
  RERANK_BASE_URL: http://bge-reranker.aaron-personal.svc.cluster.local:8000/v1
  RERANK_MODEL: bge-reranker
  TARGET_LANG: 繁體中文（台灣用語）
  SEMANTIC_SCHOLAR_LOOKUP: "true"
