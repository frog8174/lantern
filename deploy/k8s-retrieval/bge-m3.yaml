# bge-m3：中英跨語言段落向量（中文問題 ↔ 英文段落），vLLM OpenAI 相容 /v1/embeddings，模型名 bge-m3
# 叢集內：http://bge-m3.aaron-personal.svc.cluster.local:8000/v1　對外（本機開發）：https://lantern-bge.toolmen.bime.ntu.edu.tw/v1
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bge-m3
  labels: { app: bge-m3 }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: bge-m3 }
  template:
    metadata:
      labels: { app: bge-m3 }
    spec:
      nodeSelector:
        kubernetes.io/hostname: toolmen-server3   # 和 reranker 同一台（共用 RWO 快取）
      # 選卡方式同 LaBSE（docs/labse.md）：CUDA_VISIBLE_DEVICES，不向 device plugin 要 nvidia.com/gpu
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.28.0
          command: [/bin/bash, -c]
          args:
            - |-
              export CUDA_VISIBLE_DEVICES=0 CUDA_DEVICE_ORDER=PCI_BUS_ID
              exec vllm serve BAAI/bge-m3 \
                --served-model-name bge-m3 \
                --runner pooling \
                --convert embed \
                --dtype float16 \
                --max-model-len 2048 \
                --gpu-memory-utilization 0.05 \
                --port 8000

          env:
            - name: VLLM_API_KEY
              valueFrom: { secretKeyRef: { name: labse-secrets, key: VLLM_API_KEY } }
            - { name: HF_HOME, value: /cache/huggingface }
          ports:
            - { name: http, containerPort: 8000 }
          volumeMounts:
            - { name: hf-cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { memory: 4Gi }
            limits: { memory: 8Gi }
      volumes:
        - name: hf-cache
          persistentVolumeClaim: { claimName: hf-cache-retrieval }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: bge-m3
spec:
  selector: { app: bge-m3 }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bge-m3
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik-private
  tls:
    - hosts: [lantern-bge.toolmen.bime.ntu.edu.tw]
      secretName: lantern-bge-tls
  rules:
    - host: lantern-bge.toolmen.bime.ntu.edu.tw
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: bge-m3, port: { name: http } }
