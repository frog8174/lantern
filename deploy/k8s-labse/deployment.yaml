apiVersion: apps/v1
kind: Deployment
metadata:
  name: labse
  labels: { app: labse }
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO 的模型快取 PVC 不能同時掛兩個 Pod
  selector:
    matchLabels: { app: labse }
  template:
    metadata:
      labels: { app: labse }
    spec:
      # 指定 GPU 節點：改成有 GPU 的那台（kubectl get nodes）
      nodeSelector:
        kubernetes.io/hostname: toolmen-server3
      # 指定第一張卡：照叢集上既有 vLLM 的做法，在容器裡用 CUDA_VISIBLE_DEVICES 選卡（PCI_BUS_ID 順序＝nvidia-smi 的編號），
      # 不向 device plugin 要 nvidia.com/gpu。代價：k8s 不知道這張卡被用了，可能和別的工作共用；LaBSE 很小，顯存只拿 3%。
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.28.0       # 釘版本；換版前先跑 check_labse.py
          command: [/bin/bash, -c]
          args:
            - |-
              export CUDA_VISIBLE_DEVICES=0 CUDA_DEVICE_ORDER=PCI_BUS_ID
              exec vllm serve sentence-transformers/LaBSE \
                --served-model-name labse \
                --runner pooling \
                --convert embed \
                --dtype float16 \
                --max-model-len 256 \
                --gpu-memory-utilization 0.03 \
                --port 8000
          # max-model-len：LaBSE 的位置編碼上限是 256，設更大會啟動失敗。exec 讓 vllm 直接收到 SIGTERM、正常關機
          env:
            - name: VLLM_API_KEY                             # 有 Ingress 對外，所以一定要 key
              valueFrom: { secretKeyRef: { name: labse-secrets, key: VLLM_API_KEY } }
            - { name: HF_HOME, value: /cache/huggingface }
          ports:
            - { name: http, containerPort: 8000 }
          volumeMounts:
            - { name: hf-cache, mountPath: /cache }
            - { name: shm, mountPath: /dev/shm }
          startupProbe:                       # 第一次要下載模型，給 10 分鐘
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { memory: 4Gi }
            limits: { memory: 8Gi }
      volumes:
        - name: hf-cache
          persistentVolumeClaim: { claimName: hf-cache }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 2Gi }
